name: Bug report
description: Something in the plugin does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove personal data** (names, e-mails, phone numbers of real contacts) from screenshots and note excerpts. Security problems: use *Report a vulnerability* in the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open CRM
        2. Drag a card to ...
        3. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → CRM.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: "1.9.0"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Windows, macOS, Linux, iOS, Android]
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or note excerpts
      description: Optional. Anonymised, please.
