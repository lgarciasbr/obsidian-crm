name: Release

# Pushing a tag equal to manifest.json's version (x.y.z, no "v") publishes a
# GitHub release with the files Obsidian and BRAT install.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag must match manifest version
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$GITHUB_REF_NAME" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"
            exit 1
          fi
          printf '\nInstall or update with [BRAT](https://github.com/TfTHacker/obsidian42-brat) (`lgarciasbr/obsidian-crm`), or copy `main.js`, `manifest.json` and `styles.css` into `<vault>/.obsidian/plugins/crm/`.\n' >> notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
